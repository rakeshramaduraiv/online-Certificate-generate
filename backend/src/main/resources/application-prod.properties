# ==========================================
# PRODUCTION CONFIGURATION — PostgreSQL (Railway / Render)
# ==========================================
# Set SPRING_PROFILES_ACTIVE=prod on your deployment platform (Render)

# Database Configuration - PostgreSQL
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Connection pool tuning for cloud deployment
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# H2 Console - DISABLED in production
spring.h2.console.enabled=false

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# Server Configuration — Render sets PORT automatically
server.port=${PORT:8080}

# JWT Configuration
jwt.secret=${JWT_SECRET}
jwt.expiration.student=28800000
jwt.expiration.instructor=43200000
jwt.expiration.admin=21600000
jwt.refresh.expiration=604800000

app.jwtSecret=${JWT_SECRET}
app.jwtExpirationMs=${JWT_EXPIRATION:86400000}

# CORS Configuration — Set to your Netlify/Vercel frontend URL
# Falls back to localhost if env var is not set (prevents startup crash)
cors.allowed.origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:3001}

# Logging - less verbose in production
logging.level.com.examly.springapp=INFO
logging.level.org.springframework.security=WARN

# Disable Swagger UI in production for security (optional: remove if you need it)
# springdoc.swagger-ui.enabled=false
# springdoc.api-docs.enabled=false
